<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دهب | رفع البيانات الأولية</title>

  <link rel="icon" href="../assets/img/logo.png">

  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/tools.css">
</head>
<body>
  <div class="tool-page">

    <h1>🌯 رفع بيانات قائمة الطعام الأولية</h1>

    <div class="warn">
      ⚠️ <strong>هذه الصفحة تُستخدم مرة واحدة فقط</strong> لرفع كل الأصناف إلى Firebase.<br>
      بعد الانتهاء يجب حذف مجلد <code>tools/</code> قبل النشر أو حمايته.
    </div>

    <p>الأصناف الجاهزة للرفع: <strong id="itemCount">—</strong> صنفاً موزّعة على <strong id="secCount">—</strong> أقسام</p>

    <div class="tool-actions">
      <button class="btn" id="uploadBtn">🚀 رفع قائمة الطعام بالكامل إلى Firebase</button>
      <button class="btn danger" id="clearBtn">🗑️ حذف جميع البيانات (للاختبار فقط)</button>
    </div>

    <div class="log" id="log"></div>

  </div>

  <script type="module" src="seed.js"></script>
</body>
</html>
