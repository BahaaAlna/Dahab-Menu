<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دهب | طلباتي</title>

  <link rel="icon" href="assets/img/logo.png">
  <!-- أهم ملف خط: عربي 400 — يُنزَّل مع أول طلب بدل انتظار الـ CSS -->
  <link rel="preload" href="assets/fonts/ibm-plex-sans-arabic-arabic-400.woff2"
        as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/order.css">
  <link rel="stylesheet" href="assets/css/account.css">
</head>
<body>

  <a class="back-link" href="order.html" id="backLink"><span aria-hidden="true">→</span> رجوع</a>

  <button class="profile-btn" type="button" id="profileBtn" aria-label="الحساب">
    <svg class="ic" id="profileIcon" aria-hidden="true"><use href="assets/img/icons.svg#user"></use></svg>
    <span class="profile-initial" id="profileInitial" hidden></span>
  </button>

  <main class="acct-page">

    <header class="acct-head">
      <h1 class="acct-title">طلباتي</h1>
      <p class="acct-sub">حالة كل طلب تتحدّث هنا أولاً بأول</p>
    </header>

    <div class="loading" id="pageLoading">
      <div class="spinner"></div>
    </div>

    <!-- زائر غير مسجَّل -->
    <section class="acct-card acct-gate" id="gateCard" hidden>
      <p>هذه الصفحة لحسابك وحدك، ويلزم تسجيل الدخول للاطّلاع عليها.</p>
      <a class="btn full" href="order.html" id="gateLink">تسجيل الدخول</a>
    </section>

    <div class="ord-list" id="ordList" hidden></div>

  </main>

  <script type="module" src="assets/js/orders.js"></script>
</body>
</html>
