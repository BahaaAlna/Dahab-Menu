<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <title>دهب | شاورما و جريل</title>
  <meta name="description" content="دهب — شاورما و جريل، حماة. استعرض المنيو أو اطلب دليفري.">

  <link rel="icon" href="assets/img/logo.png">
  <!-- أهم ملف خط: عربي 400 — ينزل مع أول طلب بدل ما ينتظر الـ CSS -->
  <link rel="preload" href="assets/fonts/ibm-plex-sans-arabic-arabic-400.woff2"
        as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/welcome.css">
</head>
<body>

  <main class="welcome">

    <!-- ===== الهوية ===== -->
    <header class="frame welcome-frame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <img class="welcome-logo" src="assets/img/logo.png" alt="دهب — شاورما و جريل">
      <p class="welcome-tag">طعم بيستاهل</p>
      <div class="divider welcome-divider"><span></span><i></i><span></span></div>
    </header>

    <!-- ===== الخيارات ===== -->
    <h1 class="welcome-q">شو بتحب تعمل؟</h1>

    <nav class="choices" aria-label="خدمات دهب">

      <a class="choice" href="menu.html">
        <span class="choice-ic"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#dome"></use></svg></span>
        <span class="choice-text">
          <span class="choice-title">استعراض المنيو</span>
          <span class="choice-sub">شوف كل الأصناف والأسعار</span>
        </span>
        <span class="choice-go" aria-hidden="true">←</span>
      </a>

      <a class="choice" href="order.html">
        <span class="choice-ic"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#scooter"></use></svg></span>
        <span class="choice-text">
          <span class="choice-title">طلب دليفري</span>
          <span class="choice-sub">اطلب وإحنا منوصّللك</span>
        </span>
        <span class="choice-go" aria-hidden="true">←</span>
      </a>

      <button class="choice" type="button" id="tableBtn" aria-haspopup="dialog">
        <span class="choice-ic"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#table"></use></svg></span>
        <span class="choice-text">
          <span class="choice-title">طلب من الطاولة</span>
          <span class="choice-sub">إنت بالمطعم؟ امسح كود طاولتك</span>
        </span>
        <span class="choice-go" aria-hidden="true">←</span>
      </button>

    </nav>

    <footer class="welcome-foot">حماة — شارع أبي الفداء</footer>

  </main>

  <!-- ===== نافذة: كيف تطلب من الطاولة ===== -->
  <dialog class="scan-dialog" id="scanDialog" aria-labelledby="scanTitle">
    <div class="frame scan-box">
      <span class="corner sm tl"></span><span class="corner sm tr"></span>
      <span class="corner sm bl"></span><span class="corner sm br"></span>

      <div class="scan-ic"><svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#scan"></use></svg></div>
      <h2 class="scan-title" id="scanTitle">امسح كود طاولتك</h2>
      <p class="scan-text">
        افتح كاميرا موبايلك ووجّهها على الكود الموجود على طاولتك.
        المنيو بيفتح لحاله، وبيعرف رقم طاولتك، وطلبك بيوصل للمطبخ مباشرة.
      </p>
      <button class="btn full" type="button" id="scanCloseBtn">تمام</button>
    </div>
  </dialog>

  <script type="module" src="assets/js/welcome.js"></script>
</body>
</html>
