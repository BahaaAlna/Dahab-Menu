<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- ============================================================
     ✦  أيقونات دهب — ملف واحد لكل الموقع

     خطوط ذهبية رفيعة بنفس روح الهوية، بدل الإيموجي يلي
     بيطلع بألوان النظام وبيكسر الشكل.

     الاستعمال:
       <svg class="ic" aria-hidden="true">
         <use href="assets/img/icons.svg#dome"></use>
       </svg>

     اللون بياخده من العنصر الأب عبر currentColor.
     ============================================================ -->

  <symbol id="dome" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 18.5h18"/>
    <path d="M5 18.5a7 7 0 0 1 14 0"/>
    <path d="M12 6.2V5"/>
    <circle cx="12" cy="3.8" r="1.1"/>
  </symbol>

  <symbol id="scooter" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6.3" cy="16.6" r="2.8"/>
    <circle cx="17.7" cy="16.6" r="2.8"/>
    <path d="M9.1 16.6h5.8"/>
    <path d="M17.7 13.8V7.6h-2.3"/>
    <path d="M6.3 13.8V12h4.4l3.1 4.6"/>
    <path d="M3.8 9.2h4.6"/>
  </symbol>

  <symbol id="table" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 9.6h18"/>
    <path d="M5.6 9.6 4.2 19.8"/>
    <path d="M18.4 9.6l1.4 10.2"/>
    <path d="M12 9.6V14"/>
    <path d="M8.6 14h6.8"/>
  </symbol>

  <symbol id="scan" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8.6V5.6A1.6 1.6 0 0 1 5.6 4h3"/>
    <path d="M15.4 4h3A1.6 1.6 0 0 1 20 5.6v3"/>
    <path d="M20 15.4v3a1.6 1.6 0 0 1-1.6 1.6h-3"/>
    <path d="M8.6 20h-3A1.6 1.6 0 0 1 4 18.4v-3"/>
    <path d="M4 12h16"/>
  </symbol>

  <symbol id="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21c4-4.6 6-7.9 6-10.6A6 6 0 0 0 6 10.4C6 13.1 8 16.4 12 21z"/>
    <circle cx="12" cy="10.4" r="2.2"/>
  </symbol>

  <symbol id="phone" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 3.6h2.6l1.3 3.6-2 1.4a11.5 11.5 0 0 0 5.5 5.5l1.4-2 3.6 1.3V16a2.5 2.5 0 0 1-2.7 2.5A15.6 15.6 0 0 1 4.5 6.3 2.5 2.5 0 0 1 7 3.6z"/>
  </symbol>

  <symbol id="chat" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 11.4a7.6 7.6 0 0 1-11.1 6.8L4.2 19.6l1.4-4.6A7.6 7.6 0 1 1 20 11.4z"/>
  </symbol>

  <symbol id="user" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8.2" r="3.6"/>
    <path d="M4.9 20a7.3 7.3 0 0 1 14.2 0"/>
  </symbol>

  <!-- كيس الطلب: الزرّ العائم في صفحة الدليفري -->
  <symbol id="chart" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20V4"/>
    <path d="M4 20h16"/>
    <path d="M8 16v-4"/>
    <path d="M12 16V8"/>
    <path d="M16 16v-6"/>
  </symbol>

  <symbol id="bag" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.1 8h13.8l-1 11.2a1.8 1.8 0 0 1-1.8 1.6H7.9a1.8 1.8 0 0 1-1.8-1.6Z"/>
    <path d="M8.8 10.4V6.9a3.2 3.2 0 0 1 6.4 0v3.5"/>
  </symbol>

  <!-- ============================================================
       أيقونات لوحة الإدارة — بدل الإيموجي
       الإيموجي يرسمه النظام لا نحن: يختلف شكله بين أندرويد وآيفون
       وويندوز، ويأتي بألوانه الخاصة فيكسر الذهبي والأسود. وهذه
       خطوط ترث لون العنصر الأب عبر currentColor فتبقى على الهوية.
       ============================================================ -->

  <symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="m15.4 15.4 4.1 4.1"/>
  </symbol>

  <symbol id="trash" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 6.6h15"/>
    <path d="M9.4 6.6V5.2a1.4 1.4 0 0 1 1.4-1.4h2.4a1.4 1.4 0 0 1 1.4 1.4v1.4"/>
    <path d="M6.6 6.6 7.5 19a1.6 1.6 0 0 0 1.6 1.5h5.8a1.6 1.6 0 0 0 1.6-1.5l.9-12.4"/>
    <path d="M10.4 10.2v6.2M13.6 10.2v6.2"/>
  </symbol>

  <symbol id="edit" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16.2 4.4a1.9 1.9 0 0 1 2.7 2.7L8.6 17.4l-3.6.9.9-3.6Z"/>
    <path d="m14.6 6 3.4 3.4"/>
  </symbol>

  <symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m5 12.5 4.5 4.5L19 7.5"/>
  </symbol>

  <symbol id="close" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
  </symbol>

  <symbol id="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6.5 9.5 5.5 5.5 5.5-5.5"/>
  </symbol>

  <!-- جرس التنبيه: شريط طلب الإذن في لوحة الطلبات -->
  <symbol id="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 9.6a6 6 0 1 0-12 0c0 4.6-1.6 6.2-1.6 6.2h15.2S18 14.2 18 9.6Z"/>
    <path d="M13.7 19a2 2 0 0 1-3.4 0"/>
  </symbol>

</svg>
