<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دهب | طلب دليفري</title>

  <link rel="icon" href="assets/img/logo.png">
  <!-- أهم ملف خط: عربي 400 — يُنزَّل مع أول طلب بدل انتظار الـ CSS -->
  <link rel="preload" href="assets/fonts/ibm-plex-sans-arabic-arabic-400.woff2"
        as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/menu.css">
  <link rel="stylesheet" href="assets/css/order.css">

  <!-- شريط العنوان بلا ‎.html‎ — الخادم يقدّم الصفحة على الحالتين، وهذا تجميل للعنوان وحده -->
  <script>
    try {
      if (location.pathname.endsWith(".html")) {
        history.replaceState(null, "",
          location.pathname.replace(/(index)?\.html$/, "") + location.search + location.hash);
      }
    } catch (_) { /* file:// لا يسمح بتعديل العنوان */ }
  </script>
</head>
<body>

  <a class="back-link" href="./"><span aria-hidden="true">→</span> رجوع</a>

  <!-- ===== زرّ السلة — عائم في الأعلى على اليسار =====
       لا يظهر والسلة فارغة، فلا معنى لزرّ يفتح لا شيء. وأول صنف
       يُضاف يُظهره حاملاً عدد الأصناف، وضغطه يفتح نافذة التأكيد
       مباشرة: الطلب والعنوان والإرسال في مكان واحد. -->
  <button class="cart-btn" type="button" id="cartBtn" hidden
          aria-label="سلة الطلب" aria-haspopup="dialog">
    <svg class="ic" aria-hidden="true"><use href="assets/img/icons.svg#bag"></use></svg>
    <span class="cart-badge" id="cartBadge">٠</span>
  </button>

  <!-- ===== الطلب — مفتوح للكل من أول لحظة ===== -->
  <section class="order" id="orderApp">

    <header class="order-intro">
      <h1 class="order-title">طلب دليفري</h1>
      <p class="order-sub">اختر ما تريده ونحن نوصّله إليك</p>
    </header>

    <main class="order-menu" id="orderMenu">
      <div class="loading">
        <div class="spinner"></div>
        <p style="margin-top:20px;">جارٍ تحميل القائمة...</p>
      </div>
    </main>

  </section>

  <!-- ===== الرصيف السفلي: تنبيه السلة وحده =====
       شريط السلة أُزيل، فزرّ السلة العائم يؤدّي عمله. ويبقى
       الرصيف لأن التنبيه يحتاج موضعاً ثابتاً أسفل الشاشة. -->
  <div class="bottom-dock">

    <!-- يظهر عند حذف صنف من السلة لأنه لم يعد متوفراً، وهذا أفضل
         من أن يتغيّر المجموع تلقائياً دون أن يعرف الزبون السبب -->
    <p class="cart-note" id="cartNote" hidden>
      <span id="cartNoteText"></span>
      <button class="cart-note-x" type="button" id="cartNoteClose" aria-label="إغلاق التنبيه">×</button>
    </p>
  </div>

  <!-- ===== نافذة التأكيد ===== -->
  <dialog class="co-dialog" id="checkoutDialog" aria-labelledby="coTitle">
    <form method="dialog" class="co-box" id="checkoutForm">
      <h2 class="co-title" id="coTitle">تأكيد الطلب</h2>

      <div class="co-lines" id="coLines"></div>

      <div class="divider"><span></span><i></i><span></span></div>

      <!-- الاسم والرقم والعنوان: لا حسابات في الموقع، فتُكتب في
           كل طلب. وبها وحدها يصل الطلب إلى صاحبه. -->
      <label class="lbl" for="coName">الاسم</label>
      <input class="field-input" id="coName" type="text" autocomplete="name"
             placeholder="الاسم الكامل" maxlength="60" required>

      <label class="lbl" for="coPhone">رقم الهاتف</label>
      <input class="field-input" id="coPhone" type="tel" inputmode="numeric"
             autocomplete="tel" placeholder="09xxxxxxxx" required>

      <label class="lbl" for="coAddress">العنوان</label>

      <input class="field-input" id="coAddress" type="text" maxlength="200"
             placeholder="الحي والشارع وأقرب نقطة دالّة" required>

      <label class="lbl" for="coNote">ملاحظات <small>(اختياري)</small></label>
      <input class="field-input" id="coNote" type="text" maxlength="300"
             placeholder="مثال: بدون بصل، الجرس معطّل">

      <p class="co-total">المجموع: <strong id="coTotal">٠</strong> ل.س</p>
      <p class="err-msg" id="coErr" role="alert"></p>

      <div class="co-actions">
        <button class="btn full" type="button" id="confirmBtn">تأكيد وإرسال</button>
        <button class="btn ghost full" type="button" id="cancelBtn">رجوع</button>
      </div>
    </form>
  </dialog>

  <!-- ===== تم الإرسال ===== -->
  <dialog class="co-dialog" id="doneDialog" aria-labelledby="doneTitle">
    <div class="co-box done-box">
      <span class="done-mark" aria-hidden="true">✓</span>
      <h2 class="co-title" id="doneTitle">تسلّمنا طلبك</h2>
      <p class="done-sub">
        سنتصل بك على الرقم الذي كتبته لتأكيد الطلب وموعد التسليم.
      </p>

      <div class="co-actions">
        <button class="btn full" type="button" id="doneBtn">حسناً</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="assets/js/order.js"></script>
</body>
</html>
