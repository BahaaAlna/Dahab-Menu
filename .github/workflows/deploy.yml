# ============================================================
#  النشر التلقائي على GitHub Pages
#  كل دفعة push على الفرع main تؤدي إلى نشر الموقع خلال دقيقة تقريباً
#  يُنشر محتوى مجلد public/ فقط، دون مجلد tools/ لأنه يحتوي زر حذف شامل
# ============================================================

name: Deploy Menu

on:
  push:
    branches: [main]
  workflow_dispatch: # يمكن تشغيله يدوياً من تبويب Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site (exclude maintenance tools)
        run: |
          mkdir -p _site
          cp -r public/. _site/
          rm -rf _site/tools
          touch _site/.nojekyll

      # يختم روابط الأنماط والسكربتات برقم النسخة، فلا يبقى الهاتف على
      # نسخة قديمة مخزَّنة بعد النشر (Pages يُخزّن الملف 10 دقائق)
      - name: Stamp asset URLs with the commit
        run: bash scripts/stamp-assets.sh _site "$GITHUB_SHA"

      - name: List published files
        run: |
          echo "--- محتوى الموقع المنشور ---"
          find _site -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
