<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دهب | بطاقة QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d4a849;
  --gold-light:#f4d97a;
  --gold-deep:#a67c2e;
  --black:#0f0f0f;
  --cream:#f5f0e6;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Cairo',sans-serif;
  background:#2a2a2a;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:30px;
}
/* === CARD === A6-ish ratio, print friendly === */
.card{
  width:420px;
  background:
    radial-gradient(circle at 50% 0%, rgba(212,168,73,0.10), transparent 60%),
    linear-gradient(170deg,#141414,#0a0a0a);
  border:2px solid var(--gold);
  border-radius:22px;
  padding:38px 34px 34px;
  text-align:center;
  position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
/* inner hairline frame */
.card::before{
  content:"";
  position:absolute;inset:11px;
  border:1px solid rgba(212,168,73,0.35);
  border-radius:14px;
  pointer-events:none;
}
/* corner accents */
.corner{position:absolute;width:30px;height:30px;border:2px solid var(--gold);z-index:2;}
.corner.tl{top:-2px;right:-2px;border-left:none;border-bottom:none;border-radius:0 22px 0 0;}
.corner.tr{top:-2px;left:-2px;border-right:none;border-bottom:none;border-radius:22px 0 0 0;}
.corner.bl{bottom:-2px;right:-2px;border-left:none;border-top:none;border-radius:0 0 22px 0;}
.corner.br{bottom:-2px;left:-2px;border-right:none;border-top:none;border-radius:0 0 0 22px;}

.logo{
  width:200px;height:auto;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,0.5));
  margin-bottom:6px;
}
.divider{
  display:flex;align-items:center;justify-content:center;gap:12px;margin:14px auto 22px;
}
.divider span{height:1px;width:55px;background:linear-gradient(90deg,transparent,var(--gold));}
.divider span:last-child{background:linear-gradient(90deg,var(--gold),transparent);}
.divider i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);display:block;}

/* QR framed in a gold-bordered white tile */
.qr-wrap{
  display:inline-block;
  background:#fff;
  padding:16px;
  border-radius:16px;
  border:3px solid var(--gold);
  box-shadow:0 0 30px rgba(212,168,73,0.25);
  position:relative;
}
.qr-wrap img{width:210px;height:210px;display:block;}

.headline{
  font-family:'Aref Ruqaa',serif;
  font-size:2.1rem;
  font-weight:700;
  color:var(--gold-light);
  margin-top:26px;
  line-height:1.4;
  text-shadow:0 2px 12px rgba(212,168,73,0.3);
}
.headline .accent{color:var(--gold);}
.sub{
  font-size:0.95rem;
  color:var(--cream);
  letter-spacing:3px;
  margin-top:8px;
  opacity:0.75;
}
.foot{
  margin-top:22px;
  font-size:0.8rem;
  color:var(--gold-deep);
  letter-spacing:1px;
}

@media print{
  body{background:#fff;padding:0;}
  .card{box-shadow:none;margin:0 auto;}
}
@page{size:auto;margin:12mm;}
</style>
</head>
